<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking App</title>
    <style>
        body {
            background-color: antiquewhite;
            color: black;
            text-align: center;
        }
.container{
    background-color: lightgoldenrodyellow;
    text-align: left;
    justify-items: center;
    display:inline-block;
    width:950px;
    height:500px;
}
        .head-1 {
            text-align: left;
            padding: 0px;
            color: darkgray;
            font-size: 15px;
        }
        
        .poster{
            text-align: center;
    
        
            }

        .poster:hover{
            
            transform: scale(1.05);
        }

        #output{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
}
        

        
    
    </style>
</head>

<body>
    <div class="head-1">
        <h2>bookmy<b>show</b></h2>
    </div>

    <h1>🎬Book Your Movie Ticket🎫</h1>

    <div class="container">
    <h2>&nbsp;movies available:</h2>

    <a> <img src="inception.jpg" style="margin-right:10px; width:250px; height:350px; border:5px solid black;"
        class="poster"></a>
    <a><img src="bahubali.jpg" style="margin-right:10px; width:250px; height:350px;border:5px solid darkgoldenrod;" 
        class="poster"></a>
    <a><img src="avenger.jpg" style="width:250px; height:350px;border:5px solid black;"
        class="poster"></a><br><br>
    

    &nbsp;<button style="margin-right:10px; width:250px; height:40px;"onclick="bookTicket('inception')">inception</button>
        <button style="margin-right:10px; width:250px; height:40px;" onclick="bookTicket('Bahubali')">Bahubali</button>
        <button style="margin-right:10px; width:250px; height:40px;"onclick="bookTicket('Avengers')">Avengers</button>
</div>

<script>
    

         // ✅ IIFE – Runs when page loads
    (function () {
      document.getElementById("head").innerHTML=("<br>🎉 Booking App Ready!");
    })();

    // ✅ Arrow Function – Show booking confirmation
    const showConfirmation = (movie, finalprice) => {
        document.getElementById("output").innerHTML=("<br>🎟️ Booking confirmed for <strong>" + movie +"</strong>!<br>💰Price with GST:" + finalprice);
    }

    // ✅ Function Declaration – Check if movie is available
    function isMovieAvailable(movieName) {
      const availableMovies = ['Inception', 'Bahubali','Avengers'];
      return availableMovies.includes(movieName);
    }

    // ✅ Function Expression – Calculate price + GST
    const calculatePriceWithGST = function(price) {
      const gst = 0.18;
      return price + price * gst;
    }

    // ✅ Callback Function – Show message after delay
    function showPreparingMessage(callback) {
      setTimeout(function() {
        callback();
      }, 2000);
    }

    // ✅ Main function to book a movie
    function bookMovie(movie) {
      if (!isMovieAvailable(movie)) {
        document.getElementById("output").innerText=("❌ Movie not available");
        return;
      }

      const price = 200;
      const finalprice = calculatePriceWithGST(price);
      
      showPreparingMessage(() => {
      document.getElementById("output").innerHTML += "<br>🍿 Your ticket is being prepared...";
      });
      showConfirmation(movie, finalprice);
      
    }
</script>





</body>

</html>
